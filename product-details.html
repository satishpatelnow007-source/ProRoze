<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details - ProRoze</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/product-details.css"
    >

</head>


<body>


    <!-- ========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <div class="logo">
            🌹 ProRoze
        </div>


        <button
            class="menu-toggle"
            id="menuToggle"
            aria-label="Open navigation menu"
        >
            ☰
        </button>


        <ul
            class="nav-links"
            id="navLinks"
        >

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="products.html">
                    Flowers
                </a>
            </li>

            <li>
                <a href="products.html">
                    Plants
                </a>
            </li>

            <li>
                <a href="about.html">
                    About
                </a>
            </li>

            <li>
                <a href="contact.html">
                    Contact
                </a>
            </li>

            <li>
                <a href="cart.html">
                    Cart 🛒
                </a>
            </li>

            <li>
                <a href="login.html">
                    Login
                </a>
            </li>

        </ul>

    </nav>



    <!-- ========================================
         PRODUCT DETAILS
    ========================================= -->

    <section class="product-details-section">

        <div class="product-details-container">


            <!-- PRODUCT IMAGE -->

            <div class="product-details-image">

                <img
                    id="productImage"
                    src="images/red-rose.jpg"
                    alt="Product"
                >

            </div>



            <!-- PRODUCT INFORMATION -->

            <div class="product-details-info">

                <span
                    id="productCategory"
                    class="product-category"
                >
                    Flower
                </span>


                <h1 id="productName">
                    Red Rose
                </h1>


                <p
                    id="productDescription"
                    class="product-description"
                >
                    Beautiful fresh red roses
                    for every special occasion.
                </p>


                <div class="product-price">

                    ₹<span id="productPrice">
                        299
                    </span>

                </div>


                <!-- QUANTITY -->

                <div class="quantity-section">

                    <h3>
                        Quantity
                    </h3>

                    <div class="quantity-box">

                        <button
                            id="decreaseBtn"
                        >
                            −
                        </button>

                        <span id="quantity">
                            1
                        </span>

                        <button
                            id="increaseBtn"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- ADD TO CART -->

                <button
                    id="addToCartBtn"
                    class="add-cart-btn"
                >
                    🛒 Add to Cart
                </button>
                
                <button
                   id="wishlistBtn"
               class="wishlist-btn"
            >
             ❤️ Add to Wishlist
                  </button>

                <!-- BACK BUTTON -->

                <a
                    href="products.html"
                    class="back-products"
                >
                    ← Back to Products
                </a>

            </div>

        </div>

    </section>



    <!-- ========================================
         FOOTER
    ========================================= -->

    <footer class="footer">

        <h2>
            🌹 ProRoze
        </h2>

        <p>
            Bringing beautiful flowers and
            plants closer to you.
        </p>

        <p>
            © 2026 ProRoze. All Rights Reserved.
        </p>

    </footer>



    <script src="js/product-details.js"></script>

</body>

</html>
